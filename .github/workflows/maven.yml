name: Java CI with Maven batch-30
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Resolve Dependencies          # ✅ Added: populate local Maven cache
      run: mvn dependency:resolve
    - name: Build with Maven
      run: mvn -B package --file pom.xml
       
